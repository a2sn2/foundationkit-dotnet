# Development/test topology only. Do not use this file as a production deployment template.
services:
  madar-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MADAR_SQL_PASSWORD:?MADAR_SQL_PASSWORD is required}"
    ports:
      - "14335:1433"
    volumes:
      - madar-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd; else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
          "$$SQLCMD" -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  madar-api:
    build:
      context: ..
      dockerfile: apps/Madar/Madar.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Madar: "Server=madar-sqlserver,1433;Database=MadarDb;User Id=sa;Password=${MADAR_SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Madar__Bootstrap__Enabled: "true"
      Madar__Bootstrap__AdministratorEmail: "${MADAR_ADMIN_EMAIL:?MADAR_ADMIN_EMAIL is required}"
      Madar__Bootstrap__AdministratorPassword: "${MADAR_ADMIN_PASSWORD:?MADAR_ADMIN_PASSWORD is required}"
      Madar__Bootstrap__AdministratorDisplayName: "مسؤول مدار"
      Madar__Bootstrap__OperatorEmail: "${MADAR_OPERATOR_EMAIL:?MADAR_OPERATOR_EMAIL is required}"
      Madar__Bootstrap__OperatorPassword: "${MADAR_OPERATOR_PASSWORD:?MADAR_OPERATOR_PASSWORD is required}"
      Madar__Bootstrap__OperatorDisplayName: "مشغل مدار"
      Madar__Sla__Enabled: "${MADAR_SLA_ENABLED:-false}"
      Madar__Sla__Low: "${MADAR_SLA_LOW:-01:00:00}"
      Madar__Sla__Medium: "${MADAR_SLA_MEDIUM:-01:00:00}"
      Madar__Sla__High: "${MADAR_SLA_HIGH:-01:00:00}"
      Madar__Sla__Critical: "${MADAR_SLA_CRITICAL:-01:00:00}"
      Madar__Notifications__Smtp__Host: "${MADAR_SMTP_HOST:-}"
      Madar__Notifications__Smtp__Port: "${MADAR_SMTP_PORT:-587}"
      Madar__Notifications__Smtp__EnableSsl: "${MADAR_SMTP_ENABLE_SSL:-true}"
      Madar__Notifications__Smtp__Username: "${MADAR_SMTP_USERNAME:-}"
      Madar__Notifications__Smtp__Password: "${MADAR_SMTP_PASSWORD:-}"
      Madar__Notifications__Smtp__FromAddress: "${MADAR_SMTP_FROM_ADDRESS:-}"
      Madar__Attachments__StorageRoot: "/app/data/attachments"
    depends_on:
      madar-sqlserver:
        condition: service_healthy
    ports:
      - "8100:8080"
    volumes:
      - madar-attachment-data:/app/data/attachments
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  madar-sql-data:
  madar-attachment-data:
