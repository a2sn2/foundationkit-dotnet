name: FoundationKit CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: foundationkit-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build_mode: manual
          - language: javascript-typescript
            build_mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7d9249f5a57288b8a472ddd9cc3ece1921f7dc38 # immutable current supported CodeQL Action
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Set up .NET 10
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore C# solution
        if: matrix.language == 'csharp'
        run: dotnet restore FoundationKit.sln

      - name: Build C# solution for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build FoundationKit.sln --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@c2fd8f54d19fa46c94ed79cb92e6dd6606d61762 # immutable current supported CodeQL Action
        with:
          category: "/language:${{ matrix.language }}"
