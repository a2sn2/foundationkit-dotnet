name: Apply Composer exact target clarity

on:
  push:
    branches:
      - fix/composer-exact-generation-target

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/composer-exact-generation-target
          fetch-depth: 0

      - name: Patch exact target UX and regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          compose = 'samples/FoundationKit.Workbench.Client/Pages/Compose.razor'
          tests = 'tests/FoundationKit.Workbench.Tests/ComposerWorkspaceRegressionTests.cs'

          replace_once(
              compose,
              '''                    <MudText Typo="Typo.h6">generated/&lt;ProjectName&gt;</MudText>\n                    <MudText Class="muted-text mt-1">\n                        @T("المخرج مقيد داخل نسخة FoundationKit المحلية، ولا يسمح المتصفح بأي Path حر.",\n                           "Output is restricted to the local FoundationKit workspace; the browser cannot choose an arbitrary path.")\n                    </MudText>\n''',
              '''                    <MudText Typo="Typo.h6"><code>@CurrentGenerationTarget</code></MudText>\n                    <MudText Class="muted-text mt-1">\n                        @T("يعرض هذا السطر الهدف الفعلي للـManifest الذي تم التحقق منه. المخرج مقيد داخل نسخة FoundationKit المحلية ولا يسمح المتصفح بأي Path حر.",\n                           "This line shows the exact target of the validated Manifest. Output is restricted to the local FoundationKit workspace; the browser cannot choose an arbitrary path.")\n                    </MudText>\n''')

          replace_once(
              compose,
              '''            <MudCheckBox T="bool"\n                         @bind-Value="_forceGeneration"\n                         Label="@(T("أعد التوليد فقط إذا كان المجلد الحالي دون تغييرات ومملوكًا لـFoundationKit", "Regenerate only if the existing folder is unchanged and FoundationKit-owned"))"\n                         Color="Color.Warning"\n                         Class="mt-3" />\n\n            @if (!CanGenerate && !_generating && _generation is null)\n''',
              '''            <MudCheckBox T="bool"\n                         @bind-Value="_forceGeneration"\n                         Label="@(T("أعد التوليد فقط إذا كان المجلد الحالي دون تغييرات ومملوكًا لـFoundationKit", "Regenerate only if the existing folder is unchanged and FoundationKit-owned"))"\n                         Color="Color.Warning"\n                         Class="mt-3" />\n\n            @if (IsCurrentManifestValidated)\n            {\n                <MudAlert Severity="Severity.Info" Variant="Variant.Outlined" Dense="true" Class="mt-3">\n                    @T("الهدف الفعلي الحالي:", "Exact current target:") <code>@CurrentGenerationTarget</code>.\n                    @T("لن يتم إنشاء أو تحديث أي مجلد generated آخر باسم مختلف.", "No other generated folder with a different name will be created or updated.")\n                </MudAlert>\n            }\n\n            @if (!CanGenerate && !_generating && _generation is null)\n''')

          replace_once(
              compose,
              '''                    <MudAlert Severity="Severity.Success" Variant="Variant.Outlined" Class="mt-4">\n                        @T("تم توليد", "Generated") <strong>@_generation.ProjectName</strong> @T("بنجاح في", "successfully at") <code>@_generation.RelativeOutputPath</code>.\n                    </MudAlert>\n                    <div class="platform-grid mt-4 composer-metrics">\n''',
              '''                    <MudAlert Severity="Severity.Success" Variant="Variant.Outlined" Class="mt-4">\n                        @T("تم توليد", "Generated") <strong>@_generation.ProjectName</strong> @T("بنجاح في", "successfully at") <code>@_generation.RelativeOutputPath</code>.\n                    </MudAlert>\n                    <MudAlert Severity="Severity.Info" Variant="Variant.Outlined" Dense="true" Class="mt-3">\n                        @T("افتح هذا الحل تحديدًا بعد التوليد:", "Open this exact solution after generation:") <code>@GeneratedSolutionTarget</code>.\n                        @T("إذا كان لديك Solution مولد آخر مفتوحًا فأغلقه حتى لا تختبر نسخة قديمة بالخطأ.", "If another generated solution is open, close it so you do not accidentally test an older generated copy.")\n                    </MudAlert>\n                    <div class="platform-grid mt-4 composer-metrics">\n''')

          replace_once(
              compose,
              '''    private bool CanGenerate =>\n        !_validating &&\n        !_generating &&\n        IsCurrentManifestValidated &&\n        _validation?.SchemaVersion == 2;\n\n    private Color ValidationTone => _validating\n''',
              '''    private bool CanGenerate =>\n        !_validating &&\n        !_generating &&\n        IsCurrentManifestValidated &&\n        _validation?.SchemaVersion == 2;\n\n    private string CurrentGenerationTarget =>\n        IsCurrentManifestValidated && !string.IsNullOrWhiteSpace(_validation?.ProjectName)\n            ? $"generated/{_validation!.ProjectName}"\n            : "generated/<ProjectName>";\n\n    private string GeneratedSolutionTarget =>\n        _generation?.Generated == true\n            ? $"{_generation.RelativeOutputPath}/{_generation.SolutionFileName}"\n            : "—";\n\n    private Color ValidationTone => _validating\n''')

          replace_once(
              tests,
              '''        Assert.Contains("_foundationMode);", compose, StringComparison.Ordinal);\n        Assert.Contains("css/composer.css", index, StringComparison.Ordinal);\n''',
              '''        Assert.Contains("_foundationMode);", compose, StringComparison.Ordinal);\n        Assert.Contains("CurrentGenerationTarget", compose, StringComparison.Ordinal);\n        Assert.Contains("GeneratedSolutionTarget", compose, StringComparison.Ordinal);\n        Assert.Contains("No other generated folder with a different name", compose, StringComparison.Ordinal);\n        Assert.Contains("Open this exact solution after generation", compose, StringComparison.Ordinal);\n        Assert.Contains("css/composer.css", index, StringComparison.Ordinal);\n''')
          PY

      - name: Test targeted Workbench regression project
        shell: bash
        run: dotnet test tests/FoundationKit.Workbench.Tests/FoundationKit.Workbench.Tests.csproj --configuration Release

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name foundationkit-ci
          git config user.email foundationkit-ci@users.noreply.github.com
          git add samples/FoundationKit.Workbench.Client/Pages/Compose.razor tests/FoundationKit.Workbench.Tests/ComposerWorkspaceRegressionTests.cs
          git commit -m "Clarify exact Composer generation target"
          git push origin HEAD:fix/composer-exact-generation-target
