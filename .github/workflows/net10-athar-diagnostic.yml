name: Athar .NET 10 Startup Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athar-net10-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Generate temporary credentials
        shell: bash
        run: |
          sql_password="AtharDiagSql!$(openssl rand -hex 12)Aa1"
          admin_password="AtharDiagAdmin!$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$admin_password"
          echo "ATHAR_SQL_PASSWORD=$sql_password" >> "$GITHUB_ENV"
          echo "ATHAR_ADMIN_EMAIL=admin@athar.test" >> "$GITHUB_ENV"
          echo "ATHAR_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Start Athar stack
        run: docker compose -f deploy/athar-compose.yml up --build -d

      - name: Install EF Core 10 tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Restore and build Athar for migration diff
        run: |
          dotnet restore examples/Athar/Athar.Api/Athar.Api.csproj
          dotnet build examples/Athar/Athar.Api/Athar.Api.csproj --configuration Release --no-restore

      - name: Generate EF Core 10 compatibility migration
        id: migration
        continue-on-error: true
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          ConnectionStrings__Athar: Server=localhost,14334;Database=Athar;User Id=sa;Password=${{ env.ATHAR_SQL_PASSWORD }};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
          AdminSeed__Enabled: "false"
          DatabaseStartup__ApplyMigrationsOnStartup: "false"
          DatabaseStartup__SeedRolesOnStartup: "false"
        run: |
          dotnet ef migrations add Net10Compatibility \
            --project examples/Athar/Athar.Infrastructure/Athar.Infrastructure.csproj \
            --startup-project examples/Athar/Athar.Api/Athar.Api.csproj \
            --configuration Release \
            --output-dir Migrations

      - name: Capture migration diff and startup diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/athar-net10-diagnostic/migration
          git status --short > artifacts/athar-net10-diagnostic/git-status.txt
          git diff -- examples/Athar/Athar.Infrastructure/Migrations > artifacts/athar-net10-diagnostic/migration.diff
          find examples/Athar/Athar.Infrastructure/Migrations -maxdepth 1 -type f -name '*Net10Compatibility*' -exec cp {} artifacts/athar-net10-diagnostic/migration/ \; || true
          cp examples/Athar/Athar.Infrastructure/Migrations/AtharDbContextModelSnapshot.cs artifacts/athar-net10-diagnostic/migration/ModelSnapshot.cs || true
          docker compose -f deploy/athar-compose.yml ps -a > artifacts/athar-net10-diagnostic/compose-ps.txt 2>&1 || true
          docker compose -f deploy/athar-compose.yml logs --no-color --tail=800 athar-api > artifacts/athar-net10-diagnostic/athar-api.log 2>&1 || true
          docker compose -f deploy/athar-compose.yml logs --no-color --tail=400 athar-sqlserver > artifacts/athar-net10-diagnostic/athar-sqlserver.log 2>&1 || true

      - name: Upload Athar diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athar-net10-startup-diagnostic
          path: artifacts/athar-net10-diagnostic
          if-no-files-found: error
          retention-days: 3

      - name: Fail when migration generation failed
        if: steps.migration.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Stop Athar stack
        if: always()
        run: docker compose -f deploy/athar-compose.yml down --volumes --remove-orphans
