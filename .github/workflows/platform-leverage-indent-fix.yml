name: Platform leverage indentation fix

on:
  push:
    branches:
      - platform/dotnet-abp-leverage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Normalize raw-string indentation
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/FoundationKit.Composer/ComposerExecutableResourceGenerator.cs")
          text = path.read_text(encoding="utf-8")
          start_marker = "                    operation.Security ??= [];"
          end_marker = "                    });"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          i20 = " " * 20
          i24 = " " * 24
          replacement = "\n".join([
              i20 + "operation.Security ??= [];",
              i20 + "operation.Security.Add(new OpenApiSecurityRequirement",
              i20 + "{",
              i24 + "[new OpenApiSecuritySchemeReference(\"FoundationGeneratedUser\", context.Document)] = [],",
              i24 + "[new OpenApiSecuritySchemeReference(\"FoundationGeneratedRoles\", context.Document)] = []",
              i20 + "});",
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/platform-leverage-indent-fix.yml").unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Composer OpenAPI raw-string indentation"
          git push origin HEAD:platform/dotnet-abp-leverage
