name: Windows Manager Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse Core manager scripts
        shell: pwsh
        run: |
          foreach ($file in @("foundationkit.ps1", "scripts/pack.ps1", "scripts/run-workbench.ps1", "scripts/stop-workbench.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Verify manager help/status surface
        shell: pwsh
        run: .\foundationkit.ps1 help
