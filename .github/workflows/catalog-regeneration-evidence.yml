name: FoundationKit Catalog Regeneration Evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    if: github.head_ref == 'core-vnext/final-prefrontend-proof-phase-12' && github.actor != 'github-actions[bot]'
    name: Regenerate and commit canonical catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Regenerate canonical derived catalog files
        run: dotnet run --project tools/FoundationKit.CatalogGenerator -- --root "$GITHUB_WORKSPACE"

      - name: Verify generated files
        run: |
          python3 -m json.tool catalog/foundationkit.capabilities.json >/dev/null
          python3 -m json.tool catalog/foundationkit.maturity-evidence.json >/dev/null
          dotnet run --project tools/FoundationKit.CatalogGenerator -- --root "$GITHUB_WORKSPACE" --check

      - name: Commit generator output when changed
        shell: bash
        run: |
          if git diff --quiet -- catalog/foundationkit.capabilities.json catalog/foundationkit.maturity-evidence.json docs/FEATURES.md; then
            echo "Generated catalog is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/foundationkit.capabilities.json catalog/foundationkit.maturity-evidence.json docs/FEATURES.md
          git commit -m "Phase 12: regenerate canonical capability catalog"
          git push origin "HEAD:${{ github.head_ref }}"
