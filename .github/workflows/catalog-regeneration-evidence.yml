name: FoundationKit Catalog Regeneration Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate catalog from canonical Core model
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Regenerate canonical derived catalog files
        run: dotnet run --project tools/FoundationKit.CatalogGenerator -- --root "$GITHUB_WORKSPACE"

      - name: Verify generated files are valid
        run: |
          python3 -m json.tool catalog/foundationkit.capabilities.json >/dev/null
          python3 -m json.tool catalog/foundationkit.maturity-evidence.json >/dev/null
          dotnet run --project tools/FoundationKit.CatalogGenerator -- --root "$GITHUB_WORKSPACE" --check

      - name: Upload generated catalog bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase12-generated-catalog
          path: |
            catalog/foundationkit.capabilities.json
            catalog/foundationkit.maturity-evidence.json
            docs/FEATURES.md
          if-no-files-found: error
