name: Apply runtime CORS ordering fix

on:
  push:
    branches:
      - fix/composer-runtime-cors-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/composer-runtime-cors-order
          fetch-depth: 0

      - name: Apply exact source patch
        run: python3 scripts/apply-runtime-cors-order.py

      - name: Commit generated-runtime regression fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name foundationkit-ci
          git config user.email foundationkit-ci@users.noreply.github.com
          git add \
            tools/FoundationKit.Composer/ComposerBlazorRuntimeGenerator.cs \
            tests/FoundationKit.Tests/ComposerBlazorRuntimeGenerationTests.cs \
            .github/workflows/composer-blazor-runtime.yml
          git commit -m "Add browser-origin runtime CORS proof"
          git push origin HEAD:fix/composer-runtime-cors-order
