name: Apply runtime CORS ordering fix

on:
  push:
    branches:
      - fix/composer-runtime-cors-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/composer-runtime-cors-order
          fetch-depth: 0

      - name: Apply exact patch
        shell: bash
        run: |
          if grep -Fq 'const string pipelineNeedle = "app.UseSwagger();";' tools/FoundationKit.Composer/ComposerBlazorRuntimeGenerator.cs; then
            echo "Patch already applied."
            exit 0
          fi
          git apply --check scripts/runtime-cors-order.patch
          git apply scripts/runtime-cors-order.patch

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name foundationkit-ci
          git config user.email foundationkit-ci@users.noreply.github.com
          git add tools/FoundationKit.Composer/ComposerBlazorRuntimeGenerator.cs tests/FoundationKit.Tests/ComposerBlazorRuntimeGenerationTests.cs
          git commit -m "Fix generated runtime CORS ordering"
          git push origin HEAD:fix/composer-runtime-cors-order
