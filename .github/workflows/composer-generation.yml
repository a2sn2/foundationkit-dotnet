name: FoundationKit Composer Generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase14-readmodels:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Phase 14 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core-vnext/read-engine-phase-14
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Apply bounded read-model patch and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/FoundationKit.Composer/ComposerReadModelGenerator.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        return $$"""
                    migrationBuilder.Sql("""
            {{sql.TrimEnd()}}
                    """);
            """;
          '''
          new = '''        return "        migrationBuilder.Sql(" +
            JsonSerializer.Serialize(sql.TrimEnd()) +
            ");";
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'BuildCreateViewMigration raw-string anchor count was {count}, expected 1')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile scripts/phase14-composer-readmodels-patch.py
          python3 scripts/phase14-composer-readmodels-patch.py
          python3 -m json.tool catalog/foundationkit.project.schema.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-a.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-b.json >/dev/null

          git checkout origin/main -- .github/workflows/composer-generation.yml
          rm scripts/phase14-composer-readmodels-patch.py

          dotnet restore tools/FoundationKit.Composer/FoundationKit.Composer.csproj
          dotnet build tools/FoundationKit.Composer/FoundationKit.Composer.csproj --configuration Release --no-restore
          git diff --check

          git config user.name "foundationkit-ci"
          git config user.email "foundationkit-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate bounded SQL-view read models"
          git push origin HEAD:core-vnext/read-engine-phase-14
