name: FoundationKit Composer Generation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundationkit-composer-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    name: Generate, reproduce, build, and test Composer v1/v2 scaffolds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Validate Composer schema and examples as JSON
        run: |
          python3 -m json.tool catalog/foundationkit.project.schema.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.golden.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.v2.json >/dev/null

      - name: Restore Composer
        run: dotnet restore tools/FoundationKit.Composer/FoundationKit.Composer.csproj

      - name: Build Composer
        run: >-
          dotnet build tools/FoundationKit.Composer/FoundationKit.Composer.csproj
          --configuration Release
          --no-restore

      - name: Generate repository-local v1 golden project
        run: >-
          dotnet run
          --project tools/FoundationKit.Composer
          --configuration Release
          --no-build
          -- new docs/examples/foundationkit.project.golden.json
          --output artifacts/composer-golden
          --foundation-root "$GITHUB_WORKSPACE"

      - name: Prove deterministic v1 force regeneration
        shell: bash
        run: |
          find artifacts/composer-golden -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/composer-v1-before.sha256
          dotnet run \
            --project tools/FoundationKit.Composer \
            --configuration Release \
            --no-build \
            -- new docs/examples/foundationkit.project.golden.json \
            --output artifacts/composer-golden \
            --foundation-root "$GITHUB_WORKSPACE" \
            --force
          find artifacts/composer-golden -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/composer-v1-after.sha256
          diff -u /tmp/composer-v1-before.sha256 /tmp/composer-v1-after.sha256

      - name: Verify full v1 generated layer set
        shell: bash
        run: |
          test -f artifacts/composer-golden/src/ComposerGolden.Domain/ComposerGolden.Domain.csproj
          test -f artifacts/composer-golden/src/ComposerGolden.Application/ComposerGolden.Application.csproj
          test -f artifacts/composer-golden/src/ComposerGolden.Infrastructure/ComposerGolden.Infrastructure.csproj
          test -f artifacts/composer-golden/src/ComposerGolden.Api/ComposerGolden.Api.csproj
          test -f artifacts/composer-golden/src/ComposerGolden.Client/ComposerGolden.Client.csproj
          test -f artifacts/composer-golden/tests/ComposerGolden.Tests/ComposerGolden.Tests.csproj
          grep -Fq 'FoundationKit.Notifications.Smtp.csproj' artifacts/composer-golden/src/ComposerGolden.Infrastructure/ComposerGolden.Infrastructure.csproj
          grep -Fq 'FoundationKit.Auditing.csproj' artifacts/composer-golden/src/ComposerGolden.Application/ComposerGolden.Application.csproj
          grep -Fq '"schemaVersion": 1' artifacts/composer-golden/foundationkit.project.json

      - name: Restore v1 generated solution
        run: dotnet restore artifacts/composer-golden/ComposerGolden.sln

      - name: Build v1 generated solution
        run: >-
          dotnet build artifacts/composer-golden/ComposerGolden.sln
          --configuration Release
          --no-restore

      - name: Test v1 generated solution
        run: >-
          dotnet test artifacts/composer-golden/ComposerGolden.sln
          --configuration Release
          --no-build

      - name: Validate Composer v2 project model
        run: >-
          dotnet run
          --project tools/FoundationKit.Composer
          --configuration Release
          --no-build
          -- validate docs/examples/foundationkit.project.v2.json

      - name: Generate repository-local v2 project model
        run: >-
          dotnet run
          --project tools/FoundationKit.Composer
          --configuration Release
          --no-build
          -- new docs/examples/foundationkit.project.v2.json
          --output artifacts/composer-v2
          --foundation-root "$GITHUB_WORKSPACE"

      - name: Prove deterministic v2 force regeneration
        shell: bash
        run: |
          find artifacts/composer-v2 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/composer-v2-before.sha256
          dotnet run \
            --project tools/FoundationKit.Composer \
            --configuration Release \
            --no-build \
            -- new docs/examples/foundationkit.project.v2.json \
            --output artifacts/composer-v2 \
            --foundation-root "$GITHUB_WORKSPACE" \
            --force
          find artifacts/composer-v2 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/composer-v2-after.sha256
          diff -u /tmp/composer-v2-before.sha256 /tmp/composer-v2-after.sha256

      - name: Verify v2 project-model artifacts
        shell: bash
        run: |
          test -f artifacts/composer-v2/PROJECT-MODEL.md
          test -f artifacts/composer-v2/src/ComposerProjectModel.Application/GeneratedModules/Customers/CustomerDefinition.g.cs
          test -f artifacts/composer-v2/src/ComposerProjectModel.Application/GeneratedModules/Agents/AgentDefinition.g.cs
          grep -Fq '"schemaVersion": 2' artifacts/composer-v2/foundationkit.project.json
          grep -Fq '"generatorContractVersion": "2"' artifacts/composer-v2/.foundationkit-generated.json
          grep -Fq 'CustomerManager' artifacts/composer-v2/src/ComposerProjectModel.Application/GeneratedModules/Customers/CustomerDefinition.g.cs
          grep -Fq 'require-if-match' artifacts/composer-v2/src/ComposerProjectModel.Application/GeneratedModules/Customers/CustomerDefinition.g.cs

      - name: Restore v2 generated solution
        run: dotnet restore artifacts/composer-v2/ComposerProjectModel.sln

      - name: Build v2 generated solution
        run: >-
          dotnet build artifacts/composer-v2/ComposerProjectModel.sln
          --configuration Release
          --no-restore

      - name: Test v2 generated solution
        run: >-
          dotnet test artifacts/composer-v2/ComposerProjectModel.sln
          --configuration Release
          --no-build
