name: FoundationKit Composer Generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase14-readmodels:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Phase 14 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core-vnext/read-engine-phase-14
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Apply bounded read-model patch and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          generator_path = Path('tools/FoundationKit.Composer/ComposerReadModelGenerator.cs')
          lines = generator_path.read_text(encoding='utf-8').splitlines()
          sql_index = next((i for i, line in enumerate(lines) if 'var sql = $$"""' in line), None)
          if sql_index is None:
              raise SystemExit('BuildCreateViewMigration SQL anchor was not found')
          start = next((i for i in range(sql_index + 1, len(lines)) if lines[i].strip() == 'return $$"""'), None)
          if start is None:
              raise SystemExit('BuildCreateViewMigration return anchor was not found')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == '""";'), None)
          if end is None:
              raise SystemExit('BuildCreateViewMigration return end was not found')
          lines[start:end + 1] = [
              '        return "        migrationBuilder.Sql(" +',
              '            JsonSerializer.Serialize(sql.TrimEnd()) +',
              '            ");";'
          ]
          generator = '\n'.join(lines) + '\n'
          if 'using System.Globalization;' not in generator:
              generator = generator.replace(
                  'using System.Security.Cryptography;\n',
                  'using System.Globalization;\nusing System.Security.Cryptography;\n',
                  1)
          generator = generator.replace('ComposerReadModelFieldType.Guid', 'ComposerReadModelFieldType.Uuid')
          generator = re.sub(
              r'(registrations|mappings)\.AppendLine\(\n(\s+)(\$\")',
              r'\1.AppendLine(CultureInfo.InvariantCulture,\n\2\3',
              generator)
          generator = re.sub(
              r'(registrations|mappings)\.AppendLine\((\$\")',
              r'\1.AppendLine(CultureInfo.InvariantCulture, \2',
              generator)
          generator_path.write_text(generator, encoding='utf-8')

          manifest_path = Path('tools/FoundationKit.Composer/ComposerReadModelManifest.cs')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = manifest.replace('    Guid = 1', '    Uuid = 1')
          manifest = manifest.replace('ComposerReadModelFieldType.Guid', 'ComposerReadModelFieldType.Uuid')
          manifest = manifest.replace(
              'IReadOnlyDictionary<string, ComposerResourceDefinition> resources)',
              'Dictionary<string, ComposerResourceDefinition> resources)')
          manifest = manifest.replace(
              'private static IReadOnlyList<ComposerReadModelField> NormalizeFields(',
              'private static ComposerReadModelField[] NormalizeFields(')
          manifest_path.write_text(manifest, encoding='utf-8')
          PY

          python3 -m py_compile scripts/phase14-composer-readmodels-patch.py
          python3 scripts/phase14-composer-readmodels-patch.py
          python3 -m json.tool catalog/foundationkit.project.schema.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-a.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-b.json >/dev/null

          git checkout origin/main -- .github/workflows/composer-generation.yml
          rm scripts/phase14-composer-readmodels-patch.py

          dotnet restore tools/FoundationKit.Composer/FoundationKit.Composer.csproj
          dotnet build tools/FoundationKit.Composer/FoundationKit.Composer.csproj --configuration Release --no-restore
          git diff --check

          git config user.name "foundationkit-ci"
          git config user.email "foundationkit-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate bounded SQL-view read models"
          git push origin HEAD:core-vnext/read-engine-phase-14
