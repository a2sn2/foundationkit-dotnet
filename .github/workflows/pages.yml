name: FoundationKit Pages Portal

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/verify-pages.py"
      - "apps/Madar/Madar.Client/Pages/**"
      - "examples/Athar/Athar.Client/Pages/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foundationkit-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Arabic repository portal
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify portal manifest against Blazor routes
        run: python3 scripts/verify-pages.py

      - name: Check portal JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/athar-demo/app.js
          node --check site/madar-demo/app.js

      - name: Verify static product demo assets
        run: |
          test -f site/athar-demo/index.html
          test -f site/athar-demo/styles.css
          test -f site/athar-demo/app.js
          grep -q "DEMO · بدون خادم" site/athar-demo/index.html
          grep -q "athar-demo/" site/index.html

          test -f site/madar-demo/index.html
          test -f site/madar-demo/styles.css
          test -f site/madar-demo/app.js
          grep -q "DEMO · بدون خادم أو SQL" site/madar-demo/index.html
          grep -q "madar-demo/" site/index.html
          grep -q "MADAR-LOCAL-RUN-PUBLISH-AR.md" site/madar-demo/index.html

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf release
          cp -R site release
          sed -i 's|<base href="./">|<base href="/foundationkit-dotnet/">|' release/index.html
          cp release/index.html release/404.html
          touch release/.nojekyll

      - name: Verify packaged portal
        run: |
          test -f release/index.html
          test -f release/404.html
          test -f release/portal-manifest.json
          test -f release/athar-demo/index.html
          test -f release/athar-demo/styles.css
          test -f release/athar-demo/app.js
          test -f release/madar-demo/index.html
          test -f release/madar-demo/styles.css
          test -f release/madar-demo/app.js
          grep -q '<base href="/foundationkit-dotnet/">' release/index.html
          grep -q 'FoundationKit Atlas' release/index.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # immutable v5-family revision

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # immutable v3-family revision
        with:
          path: release

  deploy:
    name: Deploy FoundationKit Atlas
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # immutable v4-family revision
