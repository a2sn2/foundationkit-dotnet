name: Athar Experimental Product Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "experimental-v*"

permissions:
  contents: read

concurrency:
  group: athar-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows package and validate demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked source for committed secrets
        run: python3 scripts/security/scan-repository.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Validate the free browser demo
        run: |
          node --check site/athar-demo/app.js
          test -f site/athar-demo/index.html
          test -f site/athar-demo/styles.css
          grep -q "DEMO · بدون خادم" site/athar-demo/index.html

      - name: Restore with NuGet vulnerability audit
        run: dotnet restore FoundationKit.sln

      - name: Build Athar in Release mode
        run: >-
          dotnet build
          examples/Athar/Athar.Api/Athar.Api.csproj
          --configuration Release
          --no-restore

      - name: Test Athar
        run: >-
          dotnet test
          tests/Athar.Tests/Athar.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=athar-experimental.trx"

      - name: Publish Windows x64 package
        run: >-
          dotnet publish
          examples/Athar/Athar.Api/Athar.Api.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/athar-windows-x64/app

      - name: Add product instructions and launchers
        run: |
          cp deploy/README-PUBLISHED-AR.md artifacts/athar-windows-x64/README-AR.md
          cp docs/EXPERIMENTAL-PRODUCT-AR.md artifacts/athar-windows-x64/FULL-GUIDE-AR.md
          cp deploy/run-athar-published.ps1 artifacts/athar-windows-x64/START-PUBLISHED-ATHAR.ps1
          cp deploy/start-athar-published.cmd artifacts/athar-windows-x64/START-PUBLISHED-ATHAR.cmd
          (
            cd artifacts
            zip -r athar-experimental-windows-x64.zip athar-windows-x64
          )
          sha256sum artifacts/athar-experimental-windows-x64.zip > artifacts/athar-experimental-windows-x64.sha256

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athar-experimental-windows-x64
          path: |
            artifacts/athar-experimental-windows-x64.zip
            artifacts/athar-experimental-windows-x64.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athar-experimental-test-results
          path: tests/Athar.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 30

  container:
    name: Build and publish experimental container
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Athar container
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/foundationkit-athar"
          short_sha="${GITHUB_SHA::12}"
          docker build \
            --file examples/Athar/Athar.Api/Dockerfile \
            --tag "${image}:experimental" \
            --tag "${image}:${short_sha}" \
            .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Sign in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push experimental container
        shell: bash
        run: |
          docker push "${IMAGE}:experimental"
          docker push "${IMAGE}:${SHORT_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${SHORT_SHA}" 2>/dev/null || true)"
          echo "Published ${IMAGE}:experimental"
          echo "Published ${IMAGE}:${SHORT_SHA}"
          if [ -n "$digest" ]; then echo "Digest: $digest"; fi
