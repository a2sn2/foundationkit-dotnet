name: Run Phase 14 contract patch once

on:
  push:
    branches:
      - core-vnext/read-engine-phase-14

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core-vnext/read-engine-phase-14
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Patch Composer query/index contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = Path('tools/FoundationKit.Composer/ComposerManifest.cs')
          text = manifest.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}, expected 1')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              '''public enum ComposerResourceFieldType
          {
              Text = 0
          }
          '''.replace('          ', ''),
              '''public enum ComposerResourceFieldType
          {
              Text = 0
          }

          public enum ComposerResourceFieldFilterMode
          {
              None = 0,
              Exact = 1,
              Prefix = 2
          }
          '''.replace('          ', ''),
              'field filter enum')

          text = replace_once(
              text,
              '''public sealed record ComposerResourceField(
              string Name,
              ComposerResourceFieldType Type,
              bool Required,
              int MaximumLength);
          '''.replace('          ', ''),
              '''public sealed record ComposerResourceField(
              string Name,
              ComposerResourceFieldType Type,
              bool Required,
              int MaximumLength)
          {
              public ComposerResourceFieldFilterMode FilterMode { get; init; } = ComposerResourceFieldFilterMode.None;
              public bool Sortable { get; init; }
              public bool Indexed { get; init; }
              public bool Unique { get; init; }
          }
          '''.replace('          ', ''),
              'field record')

          text = replace_once(
              text,
              '''        var api = NormalizeApi(resource.Api);

        return new ComposerResourceDefinition(
''',
              '''        var api = NormalizeApi(resource.Api);
        var hasConfiguredFilters = fields.Any(field => field.FilterMode != ComposerResourceFieldFilterMode.None);
        var hasConfiguredSorts = fields.Any(field => field.Sortable);
        if (hasConfiguredFilters && api.MaximumFilters == 0)
        {
            throw new ComposerManifestException(
                $"Resource '{moduleName}.{name}' declares filterable fields but api.maximumFilters is 0.");
        }
        if (hasConfiguredSorts && api.MaximumSorts == 0)
        {
            throw new ComposerManifestException(
                $"Resource '{moduleName}.{name}' declares sortable fields but api.maximumSorts is 0.");
        }
        if (hasConfiguredSorts && api.MaximumSorts > 1)
        {
            throw new ComposerManifestException(
                $"Resource '{moduleName}.{name}' currently supports at most one SQL sort because CrudQueryPlan exposes one OrderBy selector.");
        }

        return new ComposerResourceDefinition(
''',
              'resource query/api validation')

          pattern = re.compile(
              r'(?P<indent>[ \t]*)fields\.Add\(new ComposerResourceField\(\s*'
              r'name,\s*type,\s*value\.Required \?\? true,\s*maximumLength\)\);')
          replacement = '''            var filterMode = value.Query?.Filter?.Trim().ToLowerInvariant() switch
            {
                null or "" or "none" => ComposerResourceFieldFilterMode.None,
                "exact" => ComposerResourceFieldFilterMode.Exact,
                "prefix" => ComposerResourceFieldFilterMode.Prefix,
                _ => throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' has unsupported query.filter '{value.Query!.Filter}'. Allowed: none, exact, prefix.")
            };
            var sortable = value.Query?.Sortable ?? false;
            var indexed = value.Index?.Enabled ?? false;
            var unique = value.Index?.Unique ?? false;
            if (unique && !indexed)
            {
                throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' cannot be unique unless index.enabled is true.");
            }
            if ((filterMode != ComposerResourceFieldFilterMode.None || sortable) && !indexed)
            {
                throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' must enable an index before it can be filterable or sortable in the generated SQL path.");
            }
            if (indexed && maximumLength > 450)
            {
                throw new ComposerManifestException(
                    $"Indexed text field '{moduleName}.{resourceName}.{name}' maximumLength cannot exceed 450 characters in the conservative SQL Server generated contract.");
            }

            fields.Add(new ComposerResourceField(
                name,
                type,
                value.Required ?? true,
                maximumLength)
            {
                FilterMode = filterMode,
                Sortable = sortable,
                Indexed = indexed,
                Unique = unique
            });'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'field normalization regex matched {count}, expected 1')

          text = replace_once(
              text,
              '''    private sealed record FieldDocument(
        string? Name,
        string? Type,
        bool? Required,
        int? MaximumLength);

    private sealed record OverridesDocument(string? Manager);
''',
              '''    private sealed record FieldDocument(
        string? Name,
        string? Type,
        bool? Required,
        int? MaximumLength,
        QueryDocument? Query,
        IndexDocument? Index);

    private sealed record QueryDocument(string? Filter, bool? Sortable);

    private sealed record IndexDocument(bool? Enabled, bool? Unique);

    private sealed record OverridesDocument(string? Manager);
''',
              'field document')

          manifest.write_text(text, encoding='utf-8')

          schema_path = Path('catalog/foundationkit.project.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          field_properties = schema['$defs']['field']['properties']
          field_properties['query'] = {'$ref': '#/$defs/fieldQuery'}
          field_properties['index'] = {'$ref': '#/$defs/fieldIndex'}
          schema['$defs']['fieldQuery'] = {
              'type': 'object',
              'additionalProperties': False,
              'properties': {
                  'filter': {'type': 'string', 'enum': ['none', 'exact', 'prefix']},
                  'sortable': {'type': 'boolean'}
              }
          }
          schema['$defs']['fieldIndex'] = {
              'type': 'object',
              'additionalProperties': False,
              'properties': {
                  'enabled': {'type': 'boolean'},
                  'unique': {'type': 'boolean'}
              }
          }
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          for relative in (
              'docs/examples/foundationkit.project.fullstack-a.json',
              'docs/examples/foundationkit.project.fullstack-b.json'):
              path = Path(relative)
              document = json.loads(path.read_text(encoding='utf-8'))
              resource = document['modules'][0]['resources'][0]
              name_field = next(item for item in resource['fields'] if item['name'] == 'Name')
              name_field['query'] = {'filter': 'prefix', 'sortable': True}
              name_field['index'] = {'enabled': True, 'unique': False}
              resource['api']['maximumFilters'] = 3
              resource['api']['maximumSorts'] = 1
              path.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')

          for helper in (
              '.github/workflows/patch-phase14-query-contract-once.yml',
              '.github/workflows/run-phase14-patch-once.yml'):
              Path(helper).unlink(missing_ok=True)
          PY

          python3 -m json.tool catalog/foundationkit.project.schema.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-a.json >/dev/null
          python3 -m json.tool docs/examples/foundationkit.project.fullstack-b.json >/dev/null
          dotnet restore tools/FoundationKit.Composer/FoundationKit.Composer.csproj
          dotnet build tools/FoundationKit.Composer/FoundationKit.Composer.csproj --configuration Release --no-restore
          git diff --check

          git config user.name "foundationkit-ci"
          git config user.email "foundationkit-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: declare generated query and index fields"
          git push origin HEAD:core-vnext/read-engine-phase-14
