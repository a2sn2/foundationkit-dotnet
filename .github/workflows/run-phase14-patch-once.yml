name: Run Phase 14 contract patch once

on:
  pull_request:
  push:
    branches:
      - core-vnext/read-engine-phase-14

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: core-vnext/read-engine-phase-14
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Patch Composer query/index contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = Path('tools/FoundationKit.Composer/ComposerManifest.cs')
          text = manifest.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}, expected 1')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              "public enum ComposerResourceFieldType\n{\n    Text = 0\n}\n",
              "public enum ComposerResourceFieldType\n{\n    Text = 0\n}\n\npublic enum ComposerResourceFieldFilterMode\n{\n    None = 0,\n    Exact = 1,\n    Prefix = 2\n}\n",
              'field filter enum')

          text = replace_once(
              text,
              "public sealed record ComposerResourceField(\n    string Name,\n    ComposerResourceFieldType Type,\n    bool Required,\n    int MaximumLength);\n",
              "public sealed record ComposerResourceField(\n    string Name,\n    ComposerResourceFieldType Type,\n    bool Required,\n    int MaximumLength)\n{\n    public ComposerResourceFieldFilterMode FilterMode { get; init; } = ComposerResourceFieldFilterMode.None;\n    public bool Sortable { get; init; }\n    public bool Indexed { get; init; }\n    public bool Unique { get; init; }\n}\n",
              'field record')

          text = replace_once(
              text,
              "        var api = NormalizeApi(resource.Api);\n\n        return new ComposerResourceDefinition(\n",
              "        var api = NormalizeApi(resource.Api);\n        var hasConfiguredFilters = fields.Any(field => field.FilterMode != ComposerResourceFieldFilterMode.None);\n        var hasConfiguredSorts = fields.Any(field => field.Sortable);\n        if (hasConfiguredFilters && api.MaximumFilters == 0)\n        {\n            throw new ComposerManifestException(\n                $\"Resource '{moduleName}.{name}' declares filterable fields but api.maximumFilters is 0.\");\n        }\n        if (hasConfiguredSorts && api.MaximumSorts == 0)\n        {\n            throw new ComposerManifestException(\n                $\"Resource '{moduleName}.{name}' declares sortable fields but api.maximumSorts is 0.\");\n        }\n        if (hasConfiguredSorts && api.MaximumSorts > 1)\n        {\n            throw new ComposerManifestException(\n                $\"Resource '{moduleName}.{name}' currently supports at most one SQL sort because CrudQueryPlan exposes one OrderBy selector.\");\n        }\n\n        return new ComposerResourceDefinition(\n",
              'resource query/api validation')

          pattern = re.compile(
              r'[ \t]*fields\.Add\(new ComposerResourceField\(\s*'
              r'name,\s*type,\s*value\.Required \?\? true,\s*maximumLength\)\);')
          replacement = '''            var filterMode = value.Query?.Filter?.Trim().ToLowerInvariant() switch
            {
                null or "" or "none" => ComposerResourceFieldFilterMode.None,
                "exact" => ComposerResourceFieldFilterMode.Exact,
                "prefix" => ComposerResourceFieldFilterMode.Prefix,
                _ => throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' has unsupported query.filter '{value.Query!.Filter}'. Allowed: none, exact, prefix.")
            };
            var sortable = value.Query?.Sortable ?? false;
            var indexed = value.Index?.Enabled ?? false;
            var unique = value.Index?.Unique ?? false;
            if (unique && !indexed)
            {
                throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' cannot be unique unless index.enabled is true.");
            }
            if ((filterMode != ComposerResourceFieldFilterMode.None || sortable) && !indexed)
            {
                throw new ComposerManifestException(
                    $"Resource field '{moduleName}.{resourceName}.{name}' must enable an index before it can be filterable or sortable in the generated SQL path.");
            }
            if (indexed && maximumLength > 450)
            {
                throw new ComposerManifestException(
                    $"Indexed text field '{moduleName}.{resourceName}.{name}' maximumLength cannot exceed 450 characters in the conservative SQL Server generated contract.");
            }

            fields.Add(new ComposerResourceField(
                name,
                type,
                value.Required ?? true,
                maximumLength)
            {
                FilterMode = filterMode,
                Sortable = sortable,
                Indexed = indexed,
                Unique = unique
            });'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'field normalization regex matched {count}, expected 1')

          text = replace_once(
              text,
              "    private sealed record FieldDocument(\n        string? Name,\n        string? Type,\n        bool? Required,\n        int? MaximumLength);\n\n    private sealed record OverridesDocument(string? Manager);\n",
              "    private sealed record FieldDocument(\n        string? Name,\n        string? Type,\n        bool? Required,\n        int? MaximumLength,\n        QueryDocument? Query,\n        IndexDocument? Index);\n\n    private sealed record QueryDocument(string? Filter, bool? Sortable);\n\n    private sealed record IndexDocument(bool? Enabled, bool? Unique);\n\n    private sealed record OverridesDocument(string? Manager);\n",
              'field document')
          manifest.write_text(text, encoding='utf-8')

          schema_path = Path('catalog/foundationkit.project.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['$defs']['field']['properties']
          props['query'] = {'$ref': '#/$defs/fieldQuery'}
          props['index'] = {'$ref': '#/$defs/fieldIndex'}
          schema['$defs']['fieldQuery'] = {
              'type': 'object', 'additionalProperties': False,
              'properties': {
                  'filter': {'type': 'string', 'enum': ['none', 'exact', 'prefix']},
                  'sortable': {'type': 'boolean'}}}
          schema['$defs']['fieldIndex'] = {
              'type': 'object', 'additionalProperties': False,
              'properties': {'enabled': {'type': 'boolean'}, 'unique': {'type': 'boolean'}}}
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          for relative in ('docs/examples/foundationkit.project.fullstack-a.json', 'docs/examples/foundationkit.project.fullstack-b.json'):
              path = Path(relative)
              document = json.loads(path.read_text(encoding='utf-8'))
              resource = document['modules'][0]['resources'][0]
              name_field = next(item for item in resource['fields'] if item['name'] == 'Name')
              name_field['query'] = {'filter': 'prefix', 'sortable': True}
              name_field['index'] = {'enabled': True, 'unique': False}
              resource['api']['maximumFilters'] = 3
              resource['api']['maximumSorts'] = 1
              path.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/patch-phase14-query-contract-once.yml').unlink(missing_ok=True)
          Path('.github/workflows/run-phase14-patch-once.yml').unlink(missing_ok=True)
          PY

          python3 -m json.tool catalog/foundationkit.project.schema.json >/dev/null
          dotnet restore tools/FoundationKit.Composer/FoundationKit.Composer.csproj
          dotnet build tools/FoundationKit.Composer/FoundationKit.Composer.csproj --configuration Release --no-restore
          git diff --check

          git config user.name "foundationkit-ci"
          git config user.email "foundationkit-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: declare generated query and index fields"
          git push origin HEAD:core-vnext/read-engine-phase-14
