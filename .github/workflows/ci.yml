name: FoundationKit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundationkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Core build, test, catalog, pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked source for committed secrets
        run: python3 scripts/security/scan-repository.py

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Verify repository boundaries
        run: bash scripts/verify-repository.sh

      - name: Validate JSON, generated-contract tooling, and static assets
        run: |
          python3 -m json.tool catalog/foundationkit.catalog.json >/dev/null
          python3 -m json.tool catalog/foundationkit.capabilities.json >/dev/null
          python3 -m json.tool catalog/foundationkit.maturity-evidence.json >/dev/null
          python3 -m json.tool postman/FoundationKit.Workbench.postman_collection.json >/dev/null
          python3 -m py_compile scripts/generate-postman-from-openapi.py
          grep -Fq 'Generated deterministically from the runtime OpenAPI contract' postman/FoundationKit.Workbench.postman_collection.json
          python3 scripts/verify-pages.py
          node --check site/app.js

      - name: Validate repository PowerShell
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @("foundationkit.ps1", "scripts/pack.ps1", "scripts/run-workbench.ps1", "scripts/stop-workbench.ps1")) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $allErrors += $parseErrors }
          }
          if ($allErrors.Count -gt 0) { $allErrors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Restore with NuGet vulnerability audit
        run: dotnet restore FoundationKit.sln

      - name: Generate dependency evidence
        run: |
          mkdir -p artifacts/security
          dotnet list FoundationKit.sln package --include-transitive --format json > artifacts/security/dotnet-packages.json
          python3 scripts/security/generate-sbom.py artifacts/security/dotnet-packages.json artifacts/security/foundationkit.cdx.json

      - name: Build
        run: dotnet build FoundationKit.sln --configuration Release --no-restore

      - name: Check generated capability documentation
        run: dotnet run --project tools/FoundationKit.CatalogGenerator --configuration Release --no-build -- --check

      - name: Test
        run: dotnet test FoundationKit.sln --configuration Release --no-build --logger "trx;LogFileName=foundationkit.trx"

      - name: Publish Workbench
        run: dotnet publish samples/FoundationKit.Workbench/FoundationKit.Workbench.Api.csproj --configuration Release --no-build --output artifacts/workbench

      - name: Pack reusable Core
        run: bash scripts/pack.sh Release artifacts/packages

      - name: Verify package count and integrity
        run: |
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 17
          test "$(find artifacts/packages -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 17
          sha256sum artifacts/packages/*.nupkg artifacts/packages/*.snupkg > artifacts/security/package-sha256.txt
          sha256sum artifacts/workbench/FoundationKit.Workbench.Api.dll > artifacts/security/publish-sha256.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-packages
          path: artifacts/packages
          if-no-files-found: error

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-security-evidence
          path: artifacts/security
          if-no-files-found: error

  sqlserver-integration-smoke:
    name: Workbench SQL Server full-stack, API Engine, and contract SSOT
    runs-on: ubuntu-latest
    needs: build-test-pack
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate temporary SQL credential
        shell: bash
        run: |
          password="Fkit!$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$password"
          echo "FOUNDATIONKIT_SQL_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Validate container hardening
        run: python3 scripts/security/check-container-hardening.py

      - name: Start Workbench stack
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Wait for Workbench
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://localhost:8080/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs --no-color --tail=300
          exit 1

      - name: Capture and verify API contract
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "blazor.webassembly.js"
          mkdir -p artifacts/openapi
          curl --fail --silent http://localhost:8080/swagger/v1/swagger.json > artifacts/openapi/workbench-swagger.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("artifacts/openapi/workbench-swagger.json").read_text(encoding="utf-8"))
          paths = document.get("paths", {})
          collection = paths.get("/api/core-crud")
          item = paths.get("/api/core-crud/{id}")
          if not isinstance(collection, dict) or not isinstance(item, dict):
              raise SystemExit("OpenAPI is missing the API Engine CRUD collection/item paths")

          for method in ("get", "post"):
              if method not in collection:
                  raise SystemExit(f"OpenAPI is missing {method.upper()} /api/core-crud")
          for method in ("get", "put", "delete"):
              if method not in item:
                  raise SystemExit(f"OpenAPI is missing {method.upper()} /api/core-crud/{{id}}")

          query_names = {
              parameter.get("name")
              for parameter in collection["get"].get("parameters", [])
              if parameter.get("in") == "query"
          }
          if query_names != {"page", "pageSize", "filter", "sort"}:
              raise SystemExit(f"Unexpected CRUD list query parameters: {sorted(query_names)}")

          for method in ("get", "put", "delete"):
              path_parameters = [
                  parameter for parameter in item[method].get("parameters", [])
                  if parameter.get("in") == "path"
              ]
              if len(path_parameters) != 1 or path_parameters[0].get("name") != "id" or not path_parameters[0].get("required"):
                  raise SystemExit(f"CRUD {method.upper()} must expose one required id path parameter")

          def require_header(operation, name):
              matches = [
                  parameter for parameter in operation.get("parameters", [])
                  if parameter.get("in") == "header" and parameter.get("name", "").lower() == name.lower()
              ]
              if len(matches) != 1 or matches[0].get("required") is not True:
                  raise SystemExit(f"OpenAPI must expose required header {name}")

          require_header(collection["post"], "Idempotency-Key")
          require_header(item["put"], "Idempotency-Key")
          require_header(item["put"], "If-Match")
          require_header(item["delete"], "Idempotency-Key")

          create_schema = collection["post"]["requestBody"]["content"]["application/json"]["schema"].get("$ref", "")
          update_schema = item["put"]["requestBody"]["content"]["application/json"]["schema"].get("$ref", "")
          if not create_schema.endswith("/CoreCrudCreateRequest"):
              raise SystemExit(f"Unexpected create schema: {create_schema}")
          if not update_schema.endswith("/CoreCrudUpdateRequest"):
              raise SystemExit(f"Unexpected update schema: {update_schema}")

          schemas = document.get("components", {}).get("schemas", {})
          update_contract = schemas.get("CoreCrudUpdateRequest", {})
          if "expectedVersion" in update_contract.get("properties", {}):
              raise SystemExit("Concurrency token leaked back into the update JSON contract")

          responses = item["put"].get("responses", {})
          for status in ("409", "412", "428"):
              if status not in responses:
                  raise SystemExit(f"CRUD update OpenAPI contract must advertise HTTP {status}")
          if "204" not in item["delete"].get("responses", {}):
              raise SystemExit("CRUD delete OpenAPI contract must advertise 204 No Content")

          required_schemas = {
              "CoreCrudCreateRequest",
              "CoreCrudUpdateRequest",
              "CoreCrudResponse",
              "CoreCrudResponsePagedResult",
              "ProblemDetails",
          }
          missing = required_schemas - set(schemas)
          if missing:
              raise SystemExit(f"OpenAPI is missing required schemas: {sorted(missing)}")

          print("FoundationKit API Engine OpenAPI contract structure verified.")
          PY

      - name: Generate and verify Postman contract from OpenAPI
        run: |
          mkdir -p artifacts/postman
          python3 scripts/generate-postman-from-openapi.py \
            artifacts/openapi/workbench-swagger.json \
            artifacts/postman/FoundationKit.Workbench.generated.json
          python3 scripts/generate-postman-from-openapi.py \
            artifacts/openapi/workbench-swagger.json \
            artifacts/postman/FoundationKit.Workbench.second.json
          cmp \
            artifacts/postman/FoundationKit.Workbench.generated.json \
            artifacts/postman/FoundationKit.Workbench.second.json
          cmp \
            postman/FoundationKit.Workbench.postman_collection.json \
            artifacts/postman/FoundationKit.Workbench.generated.json
          python3 scripts/generate-postman-from-openapi.py \
            artifacts/openapi/workbench-swagger.json \
            postman/FoundationKit.Workbench.postman_collection.json \
            --check
          python3 -m json.tool artifacts/postman/FoundationKit.Workbench.generated.json >/dev/null
          echo "OpenAPI -> Postman deterministic contract source-of-truth verified."

      - name: Upload OpenAPI contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-openapi-contract
          path: artifacts/openapi/workbench-swagger.json
          if-no-files-found: ignore

      - name: Upload generated Postman contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-postman-contract
          path: artifacts/postman/FoundationKit.Workbench.generated.json
          if-no-files-found: ignore

      - name: Run SQL integration smoke
        run: bash scripts/smoke-workbench.sh

      - name: Print logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=400

      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
