name: Platform leverage self-patch

on:
  push:
    branches:
      - platform/dotnet-abp-leverage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch generated OpenAPI compatibility
        shell: python
        run: |
          from pathlib import Path

          model = Path("tools/FoundationKit.Composer/ComposerProjectModelGenerator.cs")
          text = model.read_text(encoding="utf-8")
          old = 'private const string SwashbuckleVersion = "6.5.0";'
          new = 'private const string SwashbuckleVersion = "10.2.3";'
          assert old in text, "Expected generated Swashbuckle version marker was not found"
          model.write_text(text.replace(old, new, 1), encoding="utf-8")

          executable = Path("tools/FoundationKit.Composer/ComposerExecutableResourceGenerator.cs")
          text = executable.read_text(encoding="utf-8")
          assert text.count("using Microsoft.OpenApi.Models;") == 2, "Unexpected legacy OpenAPI namespace count"
          text = text.replace("using Microsoft.OpenApi.Models;", "using Microsoft.OpenApi;")

          old_security = '''                    operation.Security ??= new List<OpenApiSecurityRequirement>();
                    operation.Security.Add(new OpenApiSecurityRequirement
                    {
                        [new OpenApiSecurityScheme
                        {
                            Reference = new OpenApiReference
                            {
                                Type = ReferenceType.SecurityScheme,
                                Id = "FoundationGeneratedUser"
                            }
                        }] = Array.Empty<string>(),
                        [new OpenApiSecurityScheme
                        {
                            Reference = new OpenApiReference
                            {
                                Type = ReferenceType.SecurityScheme,
                                Id = "FoundationGeneratedRoles"
                            }
                        }] = Array.Empty<string>()
                    });'''
          new_security = '''                    operation.Security ??= [];
                    operation.Security.Add(new OpenApiSecurityRequirement
                    {
                        [new OpenApiSecuritySchemeReference("FoundationGeneratedUser", context.Document)] = [],
                        [new OpenApiSecuritySchemeReference("FoundationGeneratedRoles", context.Document)] = []
                    });'''
          assert old_security in text, "Expected legacy security requirement block was not found"
          executable.write_text(text.replace(old_security, new_security, 1), encoding="utf-8")

          # This workflow is intentionally ephemeral. Remove it in the same generated patch commit.
          Path(".github/workflows/platform-leverage-selfpatch.yml").unlink()

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Composer output to OpenAPI.NET 2.x"
          git push origin HEAD:platform/dotnet-abp-leverage
